name: build

on:
  push:
    branches: [main]
    # Releases are tagged as plain version numbers (1.0.0, 2.0.0, 2.1.0-rc1).
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...
      - run: VERSION=${{ github.ref_name }} ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test -race ./...
      - name: CLI -result folder checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o yahei-sarasa-cli.exe .
          gh release download 2.0.0 --repo "${{ github.repository }}" --pattern yahei-sarasa-cli.exe --output old-cli.exe
          .github/scripts/result-dir-check.sh ./yahei-sarasa-cli.exe ./old-cli.exe
